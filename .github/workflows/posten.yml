name: Posten
# Postet fällige Posts aus warteschlange/ und Probe-Reels aus dem Branch hooktests.
# Seit 17.11.2026 als Dauerlauf: ein Lauf bleibt knapp 6 Stunden wach (scripts/dauerlauf.sh) und startet sich
# danach selbst neu, weil GitHub die geplanten Starts oft nur alle paar Stunden ausführt.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      trocken_ordner:
        description: "Nur Trockenlauf für diesen Ordner (z. B. probe/2026-11-01-...), nichts wird veröffentlicht"
        required: false
permissions:
  contents: write
  actions: write
concurrency:
  group: posten
  cancel-in-progress: false
jobs:
  posten:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - name: Werkzeuge (ffmpeg, Pillow)
        if: ${{ !inputs.trocken_ordner }}
        run: |
          (command -v ffmpeg && python3 -c "import PIL") >/dev/null 2>&1 || \
            (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg python3-pil >/dev/null)
      - name: Trockenlauf
        if: ${{ inputs.trocken_ordner }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
        run: python3 scripts/posten.py --trocken --ordner "${{ inputs.trocken_ordner }}"
      - name: Dauerlauf (Posts und Probe-Reels, alle 5 Minuten)
        if: ${{ !inputs.trocken_ordner }}
        env:
          META_TOKEN: ${{ secrets.META_TOKEN }}
          DAUER_MIN: "340"
        run: bash scripts/dauerlauf.sh
      - name: Neu starten
        if: ${{ !inputs.trocken_ordner && !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run posten.yml --ref main -R "${{ github.repository }}"
